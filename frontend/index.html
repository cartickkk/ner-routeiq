<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NER-RouteIQ | SIH26002</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo-area">
            <h1>NER-RouteIQ</h1>
            <span class="badge">SIH26002</span>
        </div>
        <div id="user-nav"></div>
    </header>

    <!-- Main Container -->
    <main class="main-content">

        <!-- AUTH CONTAINER (Centered Login/Signup Box) -->
        <div id="auth-container" class="auth-card">
            <h2>Operator Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Official Email</label>
                    <input type="email" id="email-input" required placeholder="operator@ner-routeiq.gov.in">
                </div>
                <div class="form-group">
    <label>Password</label>
    <div style="position: relative;">
        <input type="password" id="password-input" required placeholder="••••••••" style="width: 100%; padding-right: 40px;">
        <button type="button" id="toggle-password-btn" title="Show/Hide Password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #94a3b8;">
            👁️
        </button>
    </div>
</div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div class="auth-footer">
                <a href="#" id="toggle-auth-mode">Need an account? Sign Up</a>
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </div>
        </div>

        <!-- DASHBOARD CONTAINER (Hidden until login) -->
        <div id="dashboard-container" class="dashboard-view" style="display: none;">
            <div class="telemetry-bar">
                <div><span>Weather Risk:</span> <span id="risk-score-display" class="risk-highlight">Evaluating...</span></div>
                <div><span>Active Corridors:</span> <span class="corridor-highlight">NH-27 / NH-37 (Monitored)</span></div>
                <div class="dash-actions">
                    <button id="emergency-btn" class="btn-danger">🚨 Trigger Emergency Alert</button>
                    <button id="logout-btn" class="btn-secondary">Logout</button>
                </div>
            </div>
            <div id="map"></div>
        </div>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- App Entry Point -->
    <script type="module" src="app.js"></script>
</body>
</html>
